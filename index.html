<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPER PORTFOLIO // BRUTAL MODE</title>
    <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Three.js Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- OVERLAYS -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="noise"></div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-top">
            <span>SYS.READY</span>
            <div class="hud-line"></div>
            <span>FPS: <strong id="fps">60</strong></span>
        </div>
        <div class="center-nav">
            TRANSITION // <strong id="transition-mode">LIQUID MORPH</strong>
        </div>
        <div class="hud-bottom">
            <span>SYSTEM: <strong>CAROUSEL.ACTIVE</strong></span>
            <div class="hud-line"></div>
            <span>VER 3.0.1 [HYPER]</span>
        </div>
    </div>

    <!-- UI Container -->
    <div id="ui">
        <!-- Slide Counter -->
        <div id="slide-counter">
            <span id="current-num">01</span>
            <span class="divider">/</span>
            <span id="total-num">03</span>
        </div>

        <!-- Navigation Buttons -->
        <div id="nav">
            <button class="nav-btn" id="prev-btn" aria-label="Previous">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="nav-btn" id="next-btn" aria-label="Next">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <!-- Project Info Overlay -->
        <div id="project-info">
            <div class="project-header">
                <span class="project-id" id="project-id">PROJECT-001</span>
                <span class="project-status" id="project-status">ACTIVE</span>
            </div>

            <h1 class="hyper-text" id="project-title" data-text="WRITEQUEST">WRITEQUEST</h1>

            <p class="project-description" id="project-description">
                Creative writing platform with AI-powered assistance, real-time collaboration,
                and immersive storytelling tools for modern authors.
            </p>

            <div class="project-tags" id="project-tags">
                <span class="tag">CREATIVE</span>
                <span class="tag">AI</span>
                <span class="tag">COLLAB</span>
            </div>

            <a href="https://writequest.netlify.app/" target="_blank" class="glass-btn" id="project-link">
                <span class="btn-glow"></span>
                <span class="btn-text">VIEW WORK</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M4 8H12M12 8L8 4M12 8L8 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
